<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Escáner ISBN → SBS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#222}main{max-width:520px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 16px #0001}h1{font-size:25px;margin:0 0 6px}p{color:#666;margin:6px 0 18px}.scan{width:100%;height:300px;background:#111;border-radius:14px;overflow:hidden;position:relative}video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;left:12%;right:12%;top:31%;height:38%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 999px #0004}.status{text-align:center;font-weight:bold;margin:14px 0}.isbn{font-size:22px;text-align:center;letter-spacing:1px;padding:12px;border:1px solid #ddd;border-radius:10px;background:#fafafa;min-height:50px}.buttons{display:grid;gap:10px;margin-top:12px}button{border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:bold;cursor:pointer}#start{background:#111;color:#fff}#search{background:#2e7d32;color:white}#copy{background:#e9e9e9}.manual{display:flex;gap:8px;margin-top:18px}.manual input{min-width:0;flex:1;padding:13px;border:1px solid #ccc;border-radius:10px;font-size:17px}.small{font-size:13px;color:#777;margin-top:12px;line-height:1.4}.hidden{display:none}</style>
</head>
<body><main><div class="card">
<h1>📚 Escáner ISBN → SBS</h1>
<p>Apuntá la cámara al código de barras del libro.</p>
<div class="scan"><video id="video" playsinline muted></video><div class="frame"></div></div>
<div id="status" class="status">Tocá “Escanear” para empezar.</div>
<div id="isbn" class="isbn">—</div>
<div class="buttons">
<button id="start">📷 Escanear ISBN</button>
<button id="copy" class="hidden">📋 Copiar ISBN</button>
<button id="search" class="hidden">🔎 Buscar en SBS</button>
</div>
<div class="manual"><input id="manual" inputmode="numeric" placeholder="O escribí el ISBN"><button id="manualBtn">OK</button></div>
<div class="small">La cámara se usa solamente en esta página. Si tu navegador no permite el lector automático, podés usar el campo manual.</div>
</div></main>
<script>
const video=document.getElementById('video'), status=document.getElementById('status'), out=document.getElementById('isbn'), start=document.getElementById('start'), copy=document.getElementById('copy'), search=document.getElementById('search'), manual=document.getElementById('manual'), manualBtn=document.getElementById('manualBtn');
let stream=null, detector=null, timer=null, current='';
function clean(v){return String(v||'').replace(/[^0-9Xx]/g,'').toUpperCase()}
function setISBN(v){v=clean(v); if(v.length<10)return; current=v; out.textContent=v; status.textContent='✅ ISBN detectado'; copy.classList.remove('hidden'); search.classList.remove('hidden'); if(navigator.vibrate)navigator.vibrate(120); stop();}
function stop(){if(timer){clearTimeout(timer);timer=null}if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
async function scan(){
 try{
  if(!('BarcodeDetector' in window)){status.textContent='⚠️ Tu navegador no tiene lector automático. Usá el campo de abajo o Google Lens.';return}
  const formats=await BarcodeDetector.getSupportedFormats();
  const wanted=formats.filter(x=>['ean_13','ean_8','upc_a','upc_e'].includes(x));
  detector=new BarcodeDetector({formats:wanted.length?wanted:formats});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
  video.srcObject=stream; await video.play(); status.textContent='📷 Buscando código…';
  const loop=async()=>{if(!stream)return;try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue){setISBN(codes[0].rawValue);return}}catch(e){}timer=setTimeout(loop,180)};loop();
 }catch(e){status.textContent='No se pudo abrir la cámara. Revisá el permiso del navegador.';}
}
start.onclick=scan;
copy.onclick=async()=>{try{await navigator.clipboard.writeText(current);status.textContent='📋 ISBN copiado';}catch(e){status.textContent='Seleccioná y copiá el ISBN: '+current;}};
search.onclick=()=>{if(current)location.href='https://www.sbs.com.ar/?ft='+encodeURIComponent(current)};
manualBtn.onclick=()=>setISBN(manual.value);
manual.addEventListener('keydown',e=>{if(e.key==='Enter')manualBtn.click()});
window.addEventListener('pagehide',stop);
</script></body></html>
